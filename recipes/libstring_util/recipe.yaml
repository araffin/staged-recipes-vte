schema_version: 1

context:
  version: "1.3.0"

package:
  name: libstring_util
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/libstring_util/libstring_util-${{ version }}.tar.gz
  sha256: 0e033e76d00b938464f6e8caae4d7ec7e29dfa817b07ab1678e6e6ce12bc8636

build:
  number: 0
  skip: not unix
  script: |
      autoreconf -if
      mkdir build
      cd build
      ../configure --prefix=$PREFIX
      make -j ${CPU_COUNT}
      make install
      # Note: shall we copy the small python utils too?

  files:
    exclude:
      - lib/libstring_util.a

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - autoconf
    - automake
    - libtool
    - make

tests:
  - package_contents:
      files:
        - if: unix
          then:
            - include/string_util/string_util.h
            - lib/libstring_util.so

about:
  summary: Simple string operations C library
  license: GPL-3.0-only
  license_file: COPYING
  homepage: https://gitlab.com/links_and_nodes/libstring_util

extra:
  recipe-maintainers:
    - araffin
    - fastflo
    - tfachmann
