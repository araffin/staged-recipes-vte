schema_version: 1

context:
  version: "1.18.2"

package:
  name: libtomcrypt
  version: ${{ version }}

source:
  url: https://github.com/libtom/libtomcrypt/releases/download/v${{ version }}/crypt-${{ version }}.tar.xz
  sha256: 96ad4c3b8336050993c5bc2cf6c057484f2b0f9f763448151567fbab5e767b84

build:
  number: 0
  skip: not unix
  script: |
      # reduce libtomcrypt build times - only what we need for daemon auth:
      make -j ${CPU_COUNT}  -f makefile.shared \
        CFLAGS="-DUSE_LTM -DLTM_DESC" EXTRALIBS="-ltommath" PREFIX=$PREFIX install
      # make -j ${CPU_COUNT} PREFIX=$PREFIX install
      # CFLAGS="-DUSE_LTM -DLTM_DESC -DLTC_NO_MODES -DLTC_NO_MACS -DLTC_NO_PKCS \
      # -DLTC_NO_MISC -DLTC_NO_PKCS -DLTC_NO_PK -DLTC_NO_CIPHERS -DLTC_NO_HASHES \
      # -DLTC_NO_PRNGS -DLTC_DER -DLTC_MDSA -DLTC_YARROW -DLTC_CTR_MODE -DLTC_XTEA -DLTC_SHA1" \

  files:
    exclude:
      - lib/libtomcrypt.a

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    # - autoconf
    # - automake
    - libtool
    - make
  host:
    - libtommath

tests:
  - package_contents:
      files:
        - if: unix
          then:
            - include/tomcrypt.h
            - lib/libtomcrypt.so

about:
  summary:  |
      LibTomCrypt is a fairly comprehensive, modular and portable cryptographic toolkit that provides
      developers with a vast array of well known published block ciphers, one-way hash functions,
      chaining modes, pseudo-random number generators, public key cryptography and a plethora of other routines.
  license: WTFPL
  license_file: LICENSE
  homepage: https://github.com/libtom/libtomcrypt/

extra:
  recipe-maintainers:
    - araffin
    - fastflo
    - tfachmann
