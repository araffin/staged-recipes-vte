# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# Taken from https://github.com/conda-forge/gtksourceview-feedstock/blob/main/recipe/recipe.yaml
schema_version: 1
context:
  name: gtksourceview
  version: "4.8.4"
  version_majmin: ${{ (version | split('.'))[:2] | join('.') }}
package:
  name: ${{ name|lower }}-gtk3
  version: ${{ version }}
source:
  url: "https://download.gnome.org/sources/${{ name }}/${{ version_majmin }}/${{ name }}-${{ version }}.tar.xz"
  sha256: 7ec9d18fb283d1f84a3a3eff3b7a72b09a10c9c006597b3fbabbb5958420a87d
build:
  number: 0
  skip: not unix
  script:
    - if: unix
      then: |
        if [[ "${CONDA_BUILD_CROSS_COMPILATION:-0}" == "1" ]]; then
          for tool in glib-mkenums glib-genmarshal; do
              cp -f ${BUILD_PREFIX}/bin/${tool} ${PREFIX}/bin/${tool}
          done
          echo '#!/bin/bash' > ${PREFIX}/bin/glib-compile-resources
          echo "exec ${BUILD_PREFIX}/bin/glib-compile-resources \"\$@\"" >> ${PREFIX}/bin/glib-compile-resources
          chmod +x ${PREFIX}/bin/glib-compile-resources
          echo '#!/bin/bash' > ${PREFIX}/bin/gtk4-update-icon-cache
          echo 'exit 0' >> ${PREFIX}/bin/gtk4-update-icon-cache
          chmod +x ${PREFIX}/bin/gtk4-update-icon-cache
        fi
        meson setup ${MESON_ARGS} \
            --prefix=$PREFIX \
            --default-library=shared \
            --wrap-mode=nofallback \
            -Dgir=true \
            -Dvapi=false \
            builddir
        ninja -v -C builddir -j ${CPU_COUNT}
        ninja -C builddir install -j ${CPU_COUNT}
  files:
    exclude:
      - '**/gschemas.compiled'
      - '**/icon-theme.cache'
      - '**/loaders.cache'
requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - meson
    - ninja
    - pkg-config
    - gobject-introspection
    - glib
  host:
    - expat
    - fontconfig
    - freetype
    - fribidi
    - glib
    - gobject-introspection
    - gtk3
    - libxml2-devel
    - zlib
    - if: unix
      then: pango
  run:
    - libgraphene
    - cairo
    - gdk-pixbuf
    # - libintl
    - pcre2
  run_exports:
    - ${{ pin_subpackage('gtksourceview-gtk3', upper_bound='x.x') }}
  ignore_run_exports:
    by_name:
      - libexpat
      - adwaita-icon-theme
      - libzlib
      - libfreetype6
tests:
  - package_contents:
      files:
        - if: unix
          then:
            - lib/pkgconfig/gtksourceview-4.pc
      lib:
        - if: unix
          then: gtksourceview-4
about:
  homepage: https://gitlab.gnome.org/GNOME/gtksourceview
  summary: A GNOME library that extends GtkTextView
  description: |
    GtkSourceView is a GNOME library that extends GtkTextView, the standard GTK
    widget for multiline text editing. GtkSourceView adds support for syntax
    highlighting, file loading and saving, search and replace, code completion,
    snippets, Vim emulation, printing, displaying line numbers, and other features
    typical of a source code editor.
  license: LGPL-2.0-or-later
  license_file: COPYING
  documentation: https://gnome.pages.gitlab.gnome.org/gtksourceview/gtksourceview5/
  repository: https://gitlab.gnome.org/GNOME/gtksourceview
extra:
  recipe-maintainers:
    - araffin
